<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delta India • Futures + Auto Resistance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070a10;color:#c8d6e5;font-family:Inter,system-ui}
.mono{font-family:"JetBrains Mono",monospace}
.card{border:1px solid #162336;background:#0c121d;border-radius:20px;padding:16px}
.input{width:100%;height:44px;border-radius:12px;background:#070a10;border:1px solid #1e314c;padding:0 12px;color:#fff;outline:none}
.btn{height:48px;border-radius:12px;background:#00d395;color:#000;font-weight:900;border:0;cursor:pointer;width:100%}
.btn:hover{background:#00c27f}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#1e2a3a;border-radius:10px}
</style>
</head>
<body>
<div style="max-width:1440px;margin:0 auto;padding:16px">
<header style="display:flex;align-items:center;justify-content:space-between;height:60px;border-bottom:1px solid #142030;margin-bottom:16px">
<div style="display:flex;gap:10px;align-items:center">
<div style="width:36px;height:36px;background:#00d395;border-radius:12px;display:grid;place-items:center;color:#000;font-weight:900">Δ</div>
<div><div style="font-weight:900;font-size:13px;color:#fff">DELTA INDIA • FUTURES • AUTO RESISTANCE</div><div class="mono" style="font-size:9px;color:#5b708b">All 59 Coins + Auto Support/Resistance Draw</div></div>
</div>
<div id="wallet" class="mono" style="font-size:12px;font-weight:900">Not Connected</div>
</header>

<div style="display:grid;grid-template-columns:380px 1fr;gap:16px">
<div style="display:flex;flex-direction:column;gap:16px">
<div class="card" style="border-color:rgba(0,211,149,.3)">
<div style="font-weight:900;font-size:12px;color:#fff;margin-bottom:12px">API CONNECT</div>
<div style="display:flex;flex-direction:column;gap:12px">
<div><label class="mono" style="font-size:10px;color:#8aa0bb;font-weight:900">API KEY *</label><div style="position:relative;margin-top:6px"><input id="apiKey" class="input mono" style="font-size:11px" placeholder="API Key"><button onclick="navigator.clipboard.readText().then(t=>document.getElementById('apiKey').value=t.trim())" style="position:absolute;right:4px;top:4px;bottom:4px;border-radius:8px;background:#111e32;border:1px solid #1e314c;color:#8aa0bb;font-size:9px;padding:0 10px;cursor:pointer">PASTE</button></div></div>
<div><label class="mono" style="font-size:10px;color:#8aa0bb;font-weight:900">API SECRET *</label><div style="position:relative;margin-top:6px"><input id="apiSecret" type="password" class="input mono" style="font-size:11px" placeholder="API Secret"><button onclick="let i=document.getElementById('apiSecret');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:60px;top:4px;bottom:4px;width:32px;border-radius:8px;background:#111e32;border:1px solid #1e314c;cursor:pointer">👁</button><button onclick="navigator.clipboard.readText().then(t=>document.getElementById('apiSecret').value=t.trim())" style="position:absolute;right:4px;top:4px;bottom:4px;border-radius:8px;background:#111e32;border:1px solid #1e314c;color:#8aa0bb;font-size:9px;padding:0 10px;cursor:pointer">PASTE</button></div></div>
<div id="msg" class="mono" style="font-size:11px;color:#ffb4b4"></div>
<button id="connectBtn" class="btn mono">CONNECT KARO</button>
</div>
</div>

<div class="card">
<div class="mono" style="font-size:11px;font-weight:900;color:#5b708b;margin-bottom:8px;display:flex;justify-content:space-between"><span>RESISTANCE SETTINGS</span><span id="levelCount" style="color:#00d395">0 levels</span></div>
<div style="display:flex;gap:6px;margin-bottom:8px">
<button id="toggleRes" onclick="showRes=!showRes;document.getElementById('toggleRes').textContent=showRes?'RESISTANCE ON':'RESISTANCE OFF';document.getElementById('toggleRes').style.opacity=showRes?'1':'0.5';drawLast()" style="flex:1;height:32px;border-radius:8px;background:rgba(255,75,75,.15);border:1px solid rgba(255,75,75,.3);color:#ff7a7a;font-size:10px;font-weight:900;cursor:pointer">RESISTANCE ON</button>
<button id="toggleSup" onclick="showSup=!showSup;document.getElementById('toggleSup').textContent=showSup?'SUPPORT ON':'SUPPORT OFF';document.getElementById('toggleSup').style.opacity=showSup?'1':'0.5';drawLast()" style="flex:1;height:32px;border-radius:8px;background:rgba(0,211,149,.15);border:1px solid rgba(0,211,149,.3);color:#00d395;font-size:10px;font-weight:900;cursor:pointer">SUPPORT ON</button>
</div>
<div id="levelsList" class="mono" style="font-size:10px;color:#8aa0bb;display:flex;flex-direction:column;gap:4px;max-height:120px;overflow:auto"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="mono" style="font-size:11px;font-weight:900;color:#fff">ALL COINS • 59 FUTURES</div><input id="coinSearch" placeholder="Search..." oninput="filterCoins(this.value)" style="height:28px;width:90px;border-radius:8px;background:#070a10;border:1px solid #1e314c;color:#fff;padding:0 8px;font-size:10px"></div>
<div id="coinList" style="max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:6px"></div>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:16px">
<div class="card" style="padding:0;overflow:hidden">
<div style="height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #162336;background:#0b111c">
<div style="display:flex;align-items:center;gap:10px">
<div class="mono" style="font-size:13px;font-weight:900;color:#fff"><span id="currentSymbol">BTCUSD</span> <span style="font-size:9px;background:rgba(0,211,149,.15);border:1px solid rgba(0,211,149,.2);color:#00d395;padding:2px 6px;border-radius:999px">FUTURES</span></div>
<select id="timeframe" onchange="loadChart(document.getElementById('currentSymbol').textContent)" style="height:32px;border-radius:8px;background:#070a10;border:1px solid #1e314c;color:#c8d6e5;padding:0 8px;font-size:11px"><option value="1m">1m</option><option value="5m" selected>5m</option><option value="15m">15m</option><option value="1h">1h</option><option value="4h">4h</option><option value="1D">1D</option></select>
</div>
<div style="display:flex;align-items:center;gap:10px">
<span id="resInfo" class="mono" style="font-size:10px;color:#ff7a7a"></span>
<div class="mono" style="font-size:13px;font-weight:900" id="currentPrice">--</div>
<div style="width:10px;height:10px;border-radius:50%;background:#00d395;box-shadow:0 0 10px #00d395"></div>
</div>
</div>
<canvas id="chart" style="width:100%;height:520px;display:block;background:#0b111c"></canvas>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#0c121d">
<button onclick="placeOrder('buy')" class="btn" style="background:#00d395">▲ BUY</button>
<button onclick="placeOrder('sell')" class="btn" style="background:#ff4b4b;color:#fff">▼ SELL</button>
</div>
</div>
<div class="card">
<div class="mono" style="font-size:11px;font-weight:900;color:#5b708b">LIVE LOGS</div>
<div id="logs" style="margin-top:8px;max-height:160px;overflow:auto;display:flex;flex-direction:column;gap:6px" class="mono"></div>
</div>
</div>
</div>
</div>

<script>
const gl="https://api.india.delta.exchange";
let apiKey="", apiSecret="", connected=false, lastCandles=[], lastLevels={res:[],sup:[]}, showRes=true, showSup=true;
const coins=["BCHUSD","BTCUSD","ETHUSD","SOLUSD","XRPUSD","DOGEUSD","BNBUSD","AVAXUSD","LINKUSD","ADAUSD","LTCUSD","UNIUSD","ARBUSD","SUIUSD","WIFUSD","PEPEUSD","SHIBUSD","DOTUSD","MATICUSD","ATOMUSD","FILUSD","APTUSD","OPUSD","ETCUSD","TRXUSD","NEARUSD","AAVEUSD","MKRUSD","STXUSD","INJUSD","RNDRUSD","EOSUSD","XTZUSD","XLMUSD","HBARUSD","ALGOUSD","EGLDUSD","THETAUSD","XMRUSD","FLOWUSD","SANDUSD","MANAUSD","AXSUSD","CHZUSD","ENJUSD","CRVUSD","COMPUSD","SNXUSD","ZECUSD","DASHUSD","LTCUSDT","ETCUSDT","BNBUSDT","ADAUSDT","DOTUSDT"];

function log(msg,type="info"){
  const el=document.getElementById('logs');
  const div=document.createElement('div');
  div.style.cssText="padding:8px 12px;border-radius:10px;border:1px solid "+(type==="buy"?"rgba(0,211,149,.2)":type==="sell"?"rgba(255,75,75,.2)":"#1e314c")+";background:"+(type==="buy"?"rgba(0,211,149,.08)":type==="sell"?"rgba(255,75,75,.08)":"#0f1a29")+";font-size:11px;color:"+(type==="buy"?"#a8ffdf":type==="sell"?"#ffb4b4":"#8aa0bb");
  div.textContent=new Date().toLocaleTimeString()+" • "+msg;
  el.prepend(div);
}
async function sign(secret,msg){const enc=new TextEncoder();const key=await crypto.subtle.importKey("raw",enc.encode(secret),{name:"HMAC",hash:"SHA-256"},false,["sign"]);const sig=await crypto.subtle.sign("HMAC",key,enc.encode(msg));return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,"0")).join("");}
async function apiCall({apiKey,apiSecret,path,method="GET",body}){const ts=Math.floor(Date.now()/1000)+1;const payload=method+ts+path+(body?JSON.stringify(body):"");const sig=await sign(apiSecret,payload);const r=await fetch(gl+path,{method,headers:{"api-key":apiKey,timestamp:ts.toString(),signature:sig,"Content-Type":"application/json"},body:method==="GET"?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok||j.success===false) throw new Error(j.error?.code||j.message||"HTTP "+r.status);return j;}

document.getElementById('connectBtn').onclick=async()=>{
  apiKey=document.getElementById('apiKey').value.trim(); apiSecret=document.getElementById('apiSecret').value.trim();
  if(!apiKey||!apiSecret){document.getElementById('msg').textContent="Dono keys dalo";return;}
  document.getElementById('msg').textContent="Connecting...";
  try{
    localStorage.setItem("delta_api_key",apiKey); localStorage.setItem("delta_api_secret",apiSecret);
    const bal=await apiCall({apiKey,apiSecret,path:"/v2/wallet/balances"}); 
    document.getElementById('wallet').textContent=bal.result?.[0]?bal.result[0].available_balance+" "+bal.result[0].asset_symbol:"Connected";
    document.getElementById('msg').textContent=""; connected=true; log("Connected • "+bal.result.length+" assets","buy");
  }catch(e){document.getElementById('msg').textContent=e.message; log("Connect failed: "+e.message,"sell");}
};

let allEls=[];
function loadCoins(){
  const list=document.getElementById('coinList'); list.innerHTML=""; allEls=[];
  coins.forEach(s=>{
    const d=document.createElement('div'); d.dataset.symbol=s.toLowerCase();
    d.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;background:#070a10;border:1px solid #1e314c;cursor:pointer";
    d.innerHTML=`<div style="display:flex;align-items:center;gap:6px"><span class="mono" style="font-size:12px;font-weight:900;color:#fff">${s}</span><span style="font-size:8px;background:#0f1a29;border:1px solid #1e314c;color:#5b708b;padding:1px 5px;border-radius:999px">FUT</span></div><div style="display:flex;gap:4px"><button style="height:22px;padding:0 8px;border-radius:6px;background:#111e32;border:1px solid #1e314c;color:#8aa0bb;font-size:9px">CHART</button><button style="height:22px;padding:0 6px;border-radius:6px;background:rgba(0,211,149,.15);border:1px solid rgba(0,211,149,.3);color:#00d395;font-size:9px">BUY</button></div>`;
    d.onclick=()=>{document.getElementById('currentSymbol').textContent=s; loadChart(s); document.querySelectorAll('#coinList div').forEach(el=>el.style.borderColor='#1e314c'); d.style.borderColor='#00d395';};
    d.querySelectorAll('button')[0].onclick=(e)=>{e.stopPropagation(); document.getElementById('currentSymbol').textContent=s; loadChart(s);};
    d.querySelectorAll('button')[1].onclick=(e)=>{e.stopPropagation(); placeOrder('buy',s);};
    list.appendChild(d); allEls.push(d);
  });
}
function filterCoins(q){const qq=q.toLowerCase(); allEls.forEach(el=>{el.style.display=el.dataset.symbol.includes(qq)?'flex':'none';});}
loadCoins();

function detectResistance(candles){
  const highs=[]; const lows=[];
  for(let i=2;i<candles.length-2;i++){
    const h=candles[i].h;
    if(h>=candles[i-1].h && h>=candles[i-2].h && h>=candles[i+1].h && h>=candles[i+2].h) highs.push(h);
    const l=candles[i].l;
    if(l<=candles[i-1].l && l<=candles[i-2].l && l<=candles[i+1].l && l<=candles[i+2].l) lows.push(l);
  }
  function cluster(arr){
    if(arr.length===0) return [];
    arr.sort((a,b)=>a-b);
    const clusters=[]; let cur=[arr[0]];
    for(let i=1;i<arr.length;i++){
      const diff=Math.abs(arr[i]-cur[0])/cur[0];
      if(diff<0.008){cur.push(arr[i]);} else {clusters.push(cur); cur=[arr[i]];}
    }
    clusters.push(cur);
    return clusters.map(c=>{
      const avg=c.reduce((a,b)=>a+b,0)/c.length;
      return {price:avg, touches:c.length, strength:c.length};
    }).sort((a,b)=>b.touches-a.touches).slice(0,4);
  }
  const res=cluster(highs).sort((a,b)=>b.price-a.price);
  const sup=cluster(lows).sort((a,b)=>b.price-a.price);
  return {res, sup};
}

let lastDrawParams=null;
function drawLast(){ if(lastDrawParams) drawChart(lastDrawParams.candles, lastDrawParams.levels); }

function drawChart(candles, levels){
  lastCandles=candles; lastLevels=levels; lastDrawParams={candles, levels};
  const canvas=document.getElementById('chart');
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.offsetWidth*2; const H=canvas.height=520*2;
  ctx.clearRect(0,0,W,H); ctx.fillStyle="#0b111c"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#162336"; ctx.lineWidth=1;
  for(let i=0;i<6;i++){const y=H*i/6; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();}
  if(candles.length===0) return;
  const min=Math.min(...candles.map(c=>c.l))*0.9985;
  const max=Math.max(...candles.map(c=>c.h))*1.0015;
  const range=max-min||1;
  const toY=p=>H-(p-min)/range*H*0.82-H*0.09;
  const toX=i=>60*2 + i*(W-80*2)/candles.length;

  if(showRes){
    levels.res.forEach((lv,idx)=>{
      const y=toY(lv.price);
      ctx.strokeStyle="rgba(255,75,75,0.75)"; ctx.setLineDash([14,10]); ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="rgba(255,75,75,0.95)"; ctx.fillRect(W-280, y-28, 280, 28);
      ctx.fillStyle="#fff"; ctx.font="bold 20px JetBrains Mono"; ctx.fillText(`R${idx+1} ${lv.price.toFixed(2)} (${lv.touches}x)`, W-270, y-8);
    });
  }
  if(showSup){
    levels.sup.forEach((lv,idx)=>{
      const y=toY(lv.price);
      ctx.strokeStyle="rgba(0,211,149,0.75)"; ctx.setLineDash([14,10]); ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="rgba(0,211,149,0.95)"; ctx.fillRect(W-280, y-28, 280, 28);
      ctx.fillStyle="#000"; ctx.font="bold 20px JetBrains Mono"; ctx.fillText(`S${idx+1} ${lv.price.toFixed(2)} (${lv.touches}x)`, W-270, y-8);
    });
  }

  const cw=(W-80*2)/candles.length*0.65;
  candles.forEach((c,i)=>{
    const x=toX(i); const yO=toY(c.o); const yC=toY(c.c); const yH=toY(c.h); const yL=toY(c.l);
    const bullish=c.c>=c.o;
    ctx.strokeStyle=bullish?"#00d395":"#ff4b4b"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,yH); ctx.lineTo(x,yL); ctx.stroke();
    ctx.fillStyle=bullish?"#00d395":"#ff4b4b";
    const h=Math.max(4, Math.abs(yC-yO)); const yy=Math.min(yO,yC);
    ctx.fillRect(x-cw/2, yy, cw, h);
  });

  ctx.fillStyle="#5b708b"; ctx.font="20px JetBrains Mono";
  for(let i=0;i<4;i++){const p=min+range*i/3; const y=toY(p); ctx.fillText(p.toFixed(2), 12, y-8);}

  const list=document.getElementById('levelsList'); list.innerHTML="";
  levels.res.forEach(l=>{const d=document.createElement('div'); d.style.cssText="display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;background:rgba(255,75,75,.12);border:1px solid rgba(255,75,75,.25)"; d.innerHTML=`<span style="color:#ff7a7a">RESISTANCE</span><span style="color:#fff;font-weight:900">${l.price.toFixed(2)} • ${l.touches}x</span>`; list.appendChild(d);});
  levels.sup.forEach(l=>{const d=document.createElement('div'); d.style.cssText="display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;background:rgba(0,211,149,.12);border:1px solid rgba(0,211,149,.25)"; d.innerHTML=`<span style="color:#00d395">SUPPORT</span><span style="color:#fff;font-weight:900">${l.price.toFixed(2)} • ${l.touches}x</span>`; list.appendChild(d);});
  document.getElementById('levelCount').textContent=(levels.res.length+levels.sup.length)+" levels auto";
  document.getElementById('resInfo').textContent=levels.res[0]?`R: ${levels.res[0].price.toFixed(2)} | S: ${levels.sup[0]?levels.sup[0].price.toFixed(2):"--"}`:"";
}

async function loadChart(sym){
  try{
    const tf=document.getElementById('timeframe').value||"5m";
    const map={"1m":"1m","5m":"5m","15m":"15m","1h":"60m","4h":"240m","1D":"1D"};
    const res=map[tf]||"5m";
    const r=await fetch(gl+`/v2/history/candles?resolution=${res}&symbol=${sym}`,{cache:"no-store"});
    const j=await r.json();
    const raw=j.result||[];
    const candles=raw.map(c=>Array.isArray(c)?{t:c[0]*1000,o:parseFloat(c[1]),h:parseFloat(c[2]),l:parseFloat(c[3]),c:parseFloat(c[4]),vol:parseFloat(c[5]||0)}:{t:(c.time||c.timestamp)*1000,o:parseFloat(c.open),h:parseFloat(c.high),l:parseFloat(c.low),c:parseFloat(c.close),vol:parseFloat(c.volume||0)}).filter(x=>!isNaN(x.c)).slice(-120);
    if(candles.length===0) return;
    const levels=detectResistance(candles);
    drawChart(candles, levels);
    document.getElementById('currentPrice').textContent=candles[candles.length-1].c.toFixed(2);
    log(`${sym} • ${tf} • Auto R:${levels.res.length} S:${levels.sup.length} • Resistance drawn`,"info");
  }catch(e){ log("Chart fail "+sym+": "+e.message,"sell"); }
}
loadChart("BTCUSD");

async function placeOrder(side, forcedSym){
  const sym=forcedSym||document.getElementById('currentSymbol').textContent;
  if(!connected){log("Connect first","sell");return;}
  try{
    const prodR=await fetch(gl+"/v2/products",{cache:"no-store"}); const prodJ=await prodR.json();
    const prod=(prodJ.result||[]).find(p=>p.symbol===sym); if(!prod) throw new Error("Product not found");
    const order={product_id:prod.id,product_symbol:sym,size:1,side,order_type:"market_order"};
    const res=await apiCall({apiKey,apiSecret,path:"/v2/orders",method:"POST",body:order});
    log(`${side.toUpperCase()} ${sym} x1 • ID:${res.result?.id||""}`,side);
  }catch(e){log(`Order fail ${sym}: ${e.message}`,"sell");}
}

try{const k=localStorage.getItem("delta_api_key"); const s=localStorage.getItem("delta_api_secret"); if(k) document.getElementById('apiKey').value=k; if(s) document.getElementById('apiSecret').value=s;}catch{}
</script>
</body>
</html>
